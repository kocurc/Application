name: CodeQL advanced

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  schedule:
    - cron: 0 1 * * 1 # At 01:00 on Monday

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [ csharp ]

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5.0.0

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.0
      with:
        dotnet-version: 9.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@cf1bb45a277cb3c205638b2cd5c984db1c46a412 # v4.30.7
      with:
        languages: ${{ matrix.language }}
        build-mode: autobuild

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@cf1bb45a277cb3c205638b2cd5c984db1c46a412 # v4.30.7
      with:
        category: /language:${{matrix.language}}
