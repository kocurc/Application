name: Print repository information

on:
  workflow_dispatch:
    inputs:
      repository-information-type:
        description: Type of repository information to print - basic or extended
        required: true
        default: basic
        type: choice
        options: [ basic, extended ]
  push:
    branches: [ master ]

permissions: read-all

jobs:
    print-repository-information:
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.1
              with:
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5.0.0

            - name: Install actions core npm package
              run: npm install @actions/core@1.11.1

            - name: Install actions github npm package
              run: npm install @actions/github@6.0.1

            - name: Print repository information
              uses: ./.github/workflows/actions/print-repository-information
              with:
                repository-information-type: ${{ github.event.inputs.repository-information-type }}

