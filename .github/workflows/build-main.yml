name: Build application

on:
  push:
      branches: [ master ]

permissions: read-all

jobs:
    build-application:
        name: Build the appplication
        runs-on: ${{ matrix.os }}
        strategy:
          matrix:
            os: [ ubuntu-latest, windows-latest ]

        steps:

        - name: Harden runner
          uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.13.1
          with:
            egress-policy: audit

        - name: Checkout repository
          uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5.0.0

        - name: Setup .NET 9 SDK
          uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.0
          with:
            dotnet-version: 9.x

        - name: Print repository data
          run: ./build.sh PrintRepositoryData

        - name: Print version data
          run: ./build.sh PrintVersionData

        - name: Restore .NET tools
          run: ./build.sh RestoreTools

        - name: Restore projects
          run: ./build.sh Restore

        - name: Build application
          run: ./build.sh Compile

        - name: Create database
          run: ./build.sh UpdateDatabase --EfProjectPath "src/ApplicationApi/ApplicationApi.csproj"
